<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcane Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1 class="site-title">ARCANE LEARNING</h1>
    <p class="site-subtitle">INSERT COIN TO PLAY</p>
  </header>

  <div class="divider"></div>

  <main class="game-grid">

    <!-- City Driver -->
    <a href="games/city-driver.html" class="game-card city-driver">
      <div class="card-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" color="#f1c40f">
          <!-- road -->
          <rect x="40" y="0" width="20" height="100" fill="#1a1a1a"/>
          <rect x="49" y="0" width="2" height="20" fill="#f1c40f" opacity="0.5"/>
          <rect x="49" y="30" width="2" height="20" fill="#f1c40f" opacity="0.5"/>
          <rect x="49" y="60" width="2" height="20" fill="#f1c40f" opacity="0.5"/>
          <!-- car body -->
          <rect x="33" y="38" width="34" height="52" rx="5" fill="#f1c40f"/>
          <!-- windshield -->
          <rect x="38" y="44" width="24" height="14" rx="2" fill="#1a1a2e"/>
          <!-- rear window -->
          <rect x="38" y="68" width="24" height="11" rx="2" fill="#1a1a2e"/>
          <!-- wheels -->
          <rect x="22" y="42" width="12" height="18" rx="3" fill="#333"/>
          <rect x="66" y="42" width="12" height="18" rx="3" fill="#333"/>
          <rect x="22" y="70" width="12" height="18" rx="3" fill="#333"/>
          <rect x="66" y="70" width="12" height="18" rx="3" fill="#333"/>
          <!-- headlights -->
          <rect x="36" y="38" width="8" height="4" rx="1" fill="#fff" opacity="0.9"/>
          <rect x="56" y="38" width="8" height="4" rx="1" fill="#fff" opacity="0.9"/>
          <!-- police lights glow -->
          <circle cx="42" cy="36" r="5" fill="#e74c3c" opacity="0.8"/>
          <circle cx="58" cy="36" r="5" fill="#3498db" opacity="0.8"/>
        </svg>
      </div>
      <div class="card-info">
        <h2 class="card-title">CITY DRIVER</h2>
        <p class="card-desc">POLICE ESCAPE<br>OUTRUN THE COPS IN AN OPEN CITY</p>
        <span class="play-btn">PLAY ▶</span>
      </div>
    </a>

    <!-- Dumpling Clicker -->
    <a href="games/dumpling-clicker.html" class="game-card dumpling">
      <div class="card-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" color="#ff6b35">
          <!-- steam lines -->
          <path d="M38 22 Q35 16 38 10" stroke="#ff6b35" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <path d="M50 20 Q47 14 50 8"  stroke="#ff6b35" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <path d="M62 22 Q59 16 62 10" stroke="#ff6b35" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <!-- dumpling body -->
          <ellipse cx="50" cy="68" rx="33" ry="22" fill="#f5deb3"/>
          <!-- fold/top -->
          <path d="M20 62 Q35 32 50 36 Q65 32 80 62" stroke="#d4a76a" stroke-width="3" fill="none"/>
          <!-- pleats -->
          <line x1="34" y1="44" x2="29" y2="62" stroke="#c49a6c" stroke-width="2"/>
          <line x1="42" y1="37" x2="39" y2="60" stroke="#c49a6c" stroke-width="2"/>
          <line x1="50" y1="36" x2="50" y2="59" stroke="#c49a6c" stroke-width="2"/>
          <line x1="58" y1="37" x2="61" y2="60" stroke="#c49a6c" stroke-width="2"/>
          <line x1="66" y1="44" x2="71" y2="62" stroke="#c49a6c" stroke-width="2"/>
          <!-- coins -->
          <circle cx="20" cy="50" r="6" fill="#ffe600" opacity="0.9"/>
          <text x="17" y="54" font-size="8" fill="#a07800" font-family="monospace">$</text>
          <circle cx="80" cy="50" r="6" fill="#ffe600" opacity="0.9"/>
          <text x="77" y="54" font-size="8" fill="#a07800" font-family="monospace">$</text>
          <circle cx="14" cy="74" r="5" fill="#ffe600" opacity="0.7"/>
          <circle cx="86" cy="74" r="5" fill="#ffe600" opacity="0.7"/>
        </svg>
      </div>
      <div class="card-info">
        <h2 class="card-title">DUMPLING CLICKER</h2>
        <p class="card-desc">IDLE CLICKER<br>CLICK YOUR WAY TO DUMPLING EMPIRE</p>
        <span class="play-btn">PLAY ▶</span>
      </div>
    </a>

    <!-- Sea of Phantoms -->
    <a href="games/sea-of-phantoms.html" class="game-card sea-of-phantoms">
      <div class="card-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" color="#00b4d8">
          <!-- ocean bg waves -->
          <path d="M0 78 Q12 70 25 78 Q38 86 50 78 Q62 70 75 78 Q88 86 100 78 L100 100 L0 100 Z" fill="#023e8a" opacity="0.6"/>
          <path d="M0 85 Q12 77 25 85 Q38 93 50 85 Q62 77 75 85 Q88 93 100 85 L100 100 L0 100 Z" fill="#0077b6" opacity="0.5"/>
          <!-- ghost body -->
          <path d="M28 80 L28 42 Q28 12 50 12 Q72 12 72 42 L72 80 L62 70 L52 80 L42 70 Z" fill="#90e0ef"/>
          <!-- ghost glow inner -->
          <path d="M34 76 L34 44 Q34 20 50 20 Q66 20 66 44 L66 76 L58 68 L52 76 L44 68 Z" fill="#caf0f8" opacity="0.5"/>
          <!-- eyes -->
          <ellipse cx="41" cy="46" rx="7" ry="8" fill="#023e8a"/>
          <ellipse cx="59" cy="46" rx="7" ry="8" fill="#023e8a"/>
          <!-- eye shine -->
          <circle cx="43" cy="43" r="2.5" fill="white"/>
          <circle cx="61" cy="43" r="2.5" fill="white"/>
          <!-- mouth -->
          <path d="M43 58 Q50 64 57 58" stroke="#023e8a" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="card-info">
        <h2 class="card-title">SEA OF PHANTOMS</h2>
        <p class="card-desc">WAVE SHOOTER<br>DEFEND THE PIER FROM THE UNDEAD</p>
        <span class="play-btn">PLAY ▶</span>
      </div>
    </a>

  </main>

  <footer>
    <p>© ARCANE LEARNING</p>
  </footer>

</body>
</html>
